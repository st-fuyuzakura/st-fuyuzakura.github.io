/* サイトのトップと同じ描き方：再生線の左はMIX前、右はマスタリング後。P が無ければ描画した波形 */
const cv=document.getElementById('w'),cx=cv.getContext('2d');
const W=1200,H=150,pad=84,n=Math.floor((W-pad*2)/4),split=0.38;
cx.scale(2,2);
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function draw(pb,pa){
  const top=1;
  const cy=H/2,maxH=H*0.46;
  for(let i=0;i<n;i++){
    const u=i/(n-1),x=pad+u*(W-pad*2);let rough,clean;
    if(pb){rough=Math.max(.012,pb[i]/top);clean=Math.max(.012,pa[i]/top)}
    else{const ph=(u*4)%1,gap=ph>0.86?Math.max(0,1-(ph-0.86)/0.06)*(ph>0.92?0:1):1,phrase=Math.min(1,ph/0.08)*gap,body=0.55+0.45*rnd(i);
      clean=phrase>0.02?(0.5+0.5*body)*phrase:0.015;const spike=rnd(i+900)<0.12?1:0.25+0.55*rnd(i+500);
      rough=phrase>0.02?Math.min(1,body*spike*phrase*1.25):0.04+0.05*rnd(i+77);clean=clean>0.03?Math.min(1,0.42+clean*0.6):clean}
    const after=u>=split,h=(after?clean:rough)*maxH,lum=after?226:96;
    cx.fillStyle=`rgb(${lum},${lum+2},${lum+4})`;cx.fillRect(x-1,cy-h-.5,2,h*2+1);
  }
  const px=pad+split*(W-pad*2);cx.fillStyle='rgba(236,238,240,.75)';cx.fillRect(px,cy-maxH-8,1,maxH*2+16);
  document.title='READY';
}
